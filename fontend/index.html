<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar Scheduling Agent</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --border: #e6e8eb;
      --border-strong: #d6d9dd;
      --text: #1a1d21;
      --text-soft: #6b7280;
      --user: #2563eb;
      --user-dark: #1d4ed8;
      --dark: #111827;
      --dark-hover: #2b3444;
      --chip: #eef0f3;
      --chip-hover: #e2e5e9;
      --radius: 16px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.05);
      --shadow-md: 0 6px 24px rgba(16, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app {
      max-width: 860px;
      margin: 0 auto;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Header */
    .header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: var(--dark);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .logo svg { width: 20px; height: 20px; }

    .header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .header p {
      margin: 2px 0 0;
      color: var(--text-soft);
      font-size: 13px;
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12.5px;
      color: var(--text-soft);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }

    /* Chat */
    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar { width: 10px; }
    .chat::-webkit-scrollbar-thumb {
      background: #d8dbe0;
      border-radius: 10px;
      border: 3px solid var(--surface);
    }
    .chat::-webkit-scrollbar-thumb:hover { background: #c2c6cd; }

    .message {
      display: flex;
      animation: rise 0.32s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: 74%;
      padding: 12px 15px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 14.5px;
      box-shadow: var(--shadow-sm);
    }

    .user .bubble {
      background: var(--user);
      color: #fff;
      border-bottom-right-radius: 5px;
    }

    .assistant .bubble {
      background: #f7f8fa;
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    /* Typing indicator */
    .typing {
      display: inline-flex;
      gap: 5px;
      align-items: center;
      padding: 4px 2px;
    }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #9aa1ab;
      animation: blink 1.3s infinite ease-in-out both;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; transform: translateY(0); }
      40% { opacity: 1; transform: translateY(-3px); }
    }

    /* Quick actions */
    .quick-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding: 12px 24px;
      border-top: 1px solid var(--border);
    }

    .quick-actions button {
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--chip);
      color: var(--text);
      padding: 7px 13px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }
    .quick-actions button:hover {
      background: var(--chip-hover);
      border-color: var(--border-strong);
    }
    .quick-actions button:active { transform: scale(0.96); }

    /* Input */
    .input-area {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      padding: 16px 24px 22px;
      border-top: 1px solid var(--border);
    }

    .input-wrap {
      flex: 1;
      display: flex;
      align-items: flex-end;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 4px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input-wrap:focus-within {
      border-color: var(--user);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      padding: 9px 10px;
      max-height: 140px;
      font-size: 14.5px;
      line-height: 1.45;
      font-family: inherit;
      color: var(--text);
    }
    textarea::placeholder { color: #9aa1ab; }

    .send-btn {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border: none;
      border-radius: 12px;
      background: var(--dark);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    }
    .send-btn:hover:not(:disabled) { background: var(--dark-hover); }
    .send-btn:active:not(:disabled) { transform: scale(0.94); }
    .send-btn:disabled { opacity: 0.4; cursor: default; }
    .send-btn svg { width: 19px; height: 19px; }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2.5"></rect>
          <line x1="3" y1="9" x2="21" y2="9"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="16" y1="2" x2="16" y2="6"></line>
        </svg>
      </div>
      <div>
        <h1>Calendar Scheduling Agent</h1>
        <p>Schedule, delete, and reschedule events in natural language</p>
      </div>
      <div class="status"><span class="dot"></span>Connected</div>
    </div>

    <div class="chat" id="chat">
      <div class="message assistant">
        <div class="bubble">Hi, I can help schedule, delete, and reschedule calendar events.

Try: Schedule study meeting on August 10, 2026 at 3 PM PST for 1 hour</div>
      </div>
    </div>

    <div class="quick-actions">
      <button onclick="fillExample('Schedule study meeting on August 10, 2026 at 3 PM PST for 1 hour')">Create</button>
      <button onclick="fillExample('Schedule basketball practice on August 10, 2026 at 3 PM PST for 1 hour')">Conflict</button>
      <button onclick="fillExample('Can I delete schedule on August 10, 2026?')">Delete</button>
      <button onclick="fillExample('Reschedule study meeting on August 10, 2026')">Reschedule</button>
      <button onclick="fillExample('Schedule Seoul timezone test on August 21, 2026 at 9 AM KST for 30 minutes')">Timezone</button>
      <button onclick="fillExample('Schedule project meeting with alex@example.com and sarah@example.com on August 23, 2026 at 3 PM PST for 1 hour')">Participants</button>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea id="messageInput" rows="1" placeholder="Message the calendar agent..."></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const API_BASE = "http://127.0.0.1:8000";

    const input = document.getElementById("messageInput");
    const sendBtn = document.getElementById("sendBtn");
    const chat = document.getElementById("chat");

    let sessionId = localStorage.getItem("calendar_agent_session_id");
    if (!sessionId) {
      sessionId = "session_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
      localStorage.setItem("calendar_agent_session_id", sessionId);
    }

    function addMessage(role, text) {
      const messageDiv = document.createElement("div");
      messageDiv.className = "message " + role;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      messageDiv.appendChild(bubble);
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    function addTyping() {
      const messageDiv = document.createElement("div");
      messageDiv.className = "message assistant";

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';

      messageDiv.appendChild(bubble);
      chat.appendChild(messageDiv);
      chat.scrollTop = chat.scrollHeight;
      return bubble;
    }

    function fillExample(text) {
      input.value = text;
      autoGrow();
      input.focus();
      updateSendState();
    }

    function updateSendState() {
      sendBtn.disabled = input.value.trim() === "";
    }

    function autoGrow() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage("user", text);
      input.value = "";
      autoGrow();
      updateSendState();

      const thinkingBubble = addTyping();

      try {
        const response = await fetch(API_BASE + "/agent_chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message: text })
        });

        const data = await response.json();
        thinkingBubble.textContent = data.reply || JSON.stringify(data, null, 2);
      } catch (error) {
        thinkingBubble.textContent = "Error: " + String(error);
      }
      chat.scrollTop = chat.scrollHeight;
    }

    input.addEventListener("input", () => { autoGrow(); updateSendState(); });

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
